# TEST_INVENTORY.yaml — P1 Test Inventory (Naming Authority for Taskq-plus)
#
# Schema contract (orchestrator loader pre-flight):
#   - First line MUST start with "# TEST_INVENTORY.yaml"
#   - Top-level key `test_inventory:` MUST exist somewhere in this file
#   - `test_inventory.tests:` blocks enumerates every tc_id, 1:1 with
#     TRACEABILITY_MATRIX.md §1 forward trace. Sub-ranges (e.g. AC-FR-01.3
#     per-char expansion a..g) MUST NOT be collapsed into a single entry.
#   - `test_inventory.by_fr.<FR>.tc_count`, `test_inventory.by_layer.<L>.count`,
#     and `test_inventory.total_test_cases` MUST reconcile (no drift).
#   - `fr_tests:` + `cross_cutting:` at the document top are kept for
#     harness `_flatten_test_names()` consumers (P1 Naming Authority forward
#     cross-check); the flat test-function names listed under those keys
#     correspond 1:1 with `test_inventory.tests[].test_function`.
#
# Phase-2 (derive_test_cases.md) MUST preserve every `test_function` declared
# here verbatim into 02-architecture/TEST_SPEC.md. Phase-3 implementation
# creates 03-development/tests/*.py files with exactly these function names.
#
# Phase: 1 — INGESTION MODE
# Source of truth: 01-requirements/SRS.md (APPROVED)
#                   01-requirements/TRACEABILITY_MATRIX.md (APPROVED)
# Format version: 1.0

# ---------------------------------------------------------------------------
# Top-level A — P1 Naming Authority (harness `_flatten_test_names()` consumers)
# Flat lists of authoritative test function names, grouped per FR and per
# cross-cutting category. Each name MUST appear once and only once across
# these two blocks, and each MUST map to exactly one tc_id below.
# ---------------------------------------------------------------------------
fr_tests:
  FR-01:
    unit:
      - test_fr01_submit_happy_path_emits_id
      - test_fr01_submit_empty_command_rejected
      - test_fr01_submit_injection_semicolon_rejected
      - test_fr01_submit_injection_pipe_rejected
      - test_fr01_submit_injection_ampersand_rejected
      - test_fr01_submit_injection_dollar_rejected
      - test_fr01_submit_injection_gt_rejected
      - test_fr01_submit_injection_lt_rejected
      - test_fr01_submit_injection_backtick_rejected
      - test_fr01_submit_command_too_long_rejected
      - test_fr01_submit_whitespace_only_rejected
      - test_fr01_submit_duplicate_name_rejected
      - test_fr01_submit_invalid_dependency_rejected
    integration:
      - test_fr01_submit_emits_audit_event
  FR-02:
    unit:
      - test_fr02_shell_false_invariant
      - test_fr02_completion_fields_atomic_write
      - test_fr02_timeout_yields_exit_4
      - test_fr02_stdout_tail_truncated_2000_chars
    integration:
      - test_fr02_run_all_kahn_topological_order
  FR-03:
    unit:
      - test_fr03_retry_with_exponential_backoff
      - test_fr03_breaker_threshold_persists_open
      - test_fr03_breaker_open_rejects_with_exit_3
      - test_fr03_breaker_half_open_success_closes
      - test_fr03_breaker_half_open_failure_reopens
    integration:
      - test_fr03_breaker_recovers_after_cooldown
  FR-04:
    unit:
      - test_fr04_cache_signature_is_sha256_of_command
      - test_fr04_cache_hit_replays_without_subprocess
      - test_fr04_cache_miss_atomic_write
    integration:
      - test_fr04_cache_thread_safe_with_run_all
  FR-05:
    unit:
      - test_fr05_cli_reachable_submit
      - test_fr05_cli_reachable_run
      - test_fr05_cli_reachable_status
      - test_fr05_cli_reachable_list
      - test_fr05_cli_reachable_graph
      - test_fr05_cli_reachable_plugins_list
      - test_fr05_cli_reachable_export
      - test_fr05_cli_reachable_clear
      - test_fr05_cli_json_flag_produces_single_line_json
      - test_fr05_exit_code_0_success
      - test_fr05_exit_code_2_validation_error
      - test_fr05_exit_code_3_breaker_open
      - test_fr05_exit_code_4_timeout
      - test_fr05_exit_code_5_dependency_cycle
      - test_fr05_exit_code_6_plugin_load_failure
      - test_fr05_exit_code_1_internal_error
  FR-06:
    unit:
      - test_fr06_dag_depends_on_persisted_to_tasks_json
      - test_fr06_dag_cycle_rejected_with_path
      - test_fr06_dag_depth_cap_rejected
      - test_fr06_dag_blocked_does_not_count_for_breaker
      - test_fr06_graph_text_outputs_indented_tree
      - test_fr06_graph_dot_outputs_graphviz_dot
    integration:
      - test_fr06_dag_kahn_order_with_blocked_semantics
  FR-07:
    unit:
      - test_fr07_plugin_path_form_rejected
      - test_fr07_plugin_invalid_regex_rejected
      - test_fr07_plugin_3_consecutive_failures_disables
      - test_fr07_plugin_eval_exec_import_disabled
    integration:
      - test_fr07_plugin_error_does_not_abort_run
  FR-08:
    unit:
      - test_fr08_audit_jsonl_append_with_fsync
      - test_fr08_export_json_format
      - test_fr08_export_csv_format
      - test_fr08_export_md_format
      - test_fr08_export_csv_rfc4180_quoting
    integration:
      - test_fr08_audit_correlation_id_shared_per_invocation
      - test_fr08_secret_in_command_not_in_audit_jsonl

cross_cutting:
  perf:
    - test_perf_submit_status_p95_below_50ms
    - test_perf_run_all_toposort_p95_below_200ms
  security:
    - test_security_grep_shell_true_returns_zero
    - test_security_per_char_injection_seven_chars
    - test_security_grep_eval_exec_import_returns_zero
    - test_security_plugin_allowlist_regex
    - test_security_bandit_zero_high_medium
  error_handling:
    - test_error_tasks_json_atomic_write
    - test_error_breaker_json_atomic_write
    - test_error_cache_json_atomic_write
    - test_error_audit_jsonl_append_fsync
    - test_error_no_bare_except_clause
    - test_error_breaker_open_to_closed_within_cooldown_plus_1s
  redact:
    - test_redact_stdout_tail_applied_before_write
    - test_redact_stderr_tail_applied_before_write
    - test_redact_audit_detail_applied_before_write
    - test_redact_sk_secret_in_audit_jsonl_grep_zero
    - test_redact_in_memory_not_persisted
  docs:
    - test_docs_ast_docstrings_100_percent
    - test_docs_docstring_contains_fr_or_nfr_tag
  arch:
    - test_arch_importlinter_exists_and_declares_layers
    - test_arch_lint_imports_exit_zero
    - test_arch_no_blanket_ignore_imports
  license:
    - test_license_requirements_txt_pin_eq
    - test_license_pip_licenses_allowlist
    - test_license_sbom_json_present
  mutation:
    - test_mutation_harness_config_flag_true
    - test_mutation_score_at_least_70
  zero_skip:
    - test_zero_skip_pytest_skipped_zero
    - test_zero_skip_ast_assertions_zero
    - test_zero_skip_no_ignore_k_deselect_collect_ignore
    - test_zero_skip_traceability_verified_only_after_run
  integration_gate:
    - test_int_cov_line_at_least_80_percent
    - test_int_driven_via_cli_or_clirunner
    - test_int_spans_submit_to_run_to_status_chain
  readability:
    - test_readability_mi_at_least_80
    - test_readability_cyclomatic_complexity_le_10
    - test_readability_file_loc_le_400_dir_files_le_15
  verify_target:
    - test_makefile_verify_system_target_exists
    - test_makefile_verify_system_exits_zero_and_passes

# ---------------------------------------------------------------------------
# Top-level B — Orchestrator-required schema (binds `test_inventory:` key).
# This block enumerates every tc_id 1:1 with TRACEABILITY_MATRIX.md §1,
# and is the machine-decidable source that downstream `advance-phase` reads.
# ---------------------------------------------------------------------------
test_inventory:
  format_version: "1.0"
  project: taskq-plus
  phase: 1
  canonical_source: 01-requirements/SRS.md
  traceability_source: 01-requirements/TRACEABILITY_MATRIX.md

  # --- per-acceptance-criterion contracts -----------------------------------
  tests:

    # ===== FR-01: 任務提交與驗證 (7 ACs; AC-01.3 expands to 7 sub-cases) =====
    - tc_id: TC-FR01-01
      fr_id: FR-01
      ac_ref: AC-FR-01.1
      spec_ref: "SPEC.md §8 #4"
      layer: unit
      test_function: test_fr01_submit_happy_path_emits_id
      assertion: 'python -m taskq_plus submit "echo hi" emits an 8-hex id on stdout and exits 0'
      cross_ref_frs: []
      cross_ref_nfrs: []

    - tc_id: TC-FR01-02
      fr_id: FR-01
      ac_ref: AC-FR-01.2
      spec_ref: "SPEC.md §8 #5"
      layer: unit
      test_function: test_fr01_submit_empty_command_rejected
      assertion: 'python -m taskq_plus submit "" exits 2; nothing written to tasks.json'
      cross_ref_frs: []
      cross_ref_nfrs: [NFR-03]

    # AC-FR-01.3 — NFR-02 injection-char expansion (7 chars per NFR-02.2).
    # Range syntax TC-FR01-03a..g is documentation shorthand only; each sub-case
    # below is a SEPARATE contract item with its own asserts.
    - tc_id: TC-FR01-03a
      fr_id: FR-01
      ac_ref: AC-FR-01.3
      sub_case: "semicolon"
      spec_ref: "SPEC.md §8 #6; SRS.md §3 FR-01 (injection chars)"
      layer: unit
      test_function: test_fr01_submit_injection_semicolon_rejected
      assertion: 'python -m taskq_plus submit "echo hi; rm x" exits 2 (semicolon rejected)'
      cross_ref_frs: []
      cross_ref_nfrs: [NFR-02]
    - tc_id: TC-FR01-03b
      fr_id: FR-01
      ac_ref: AC-FR-01.3
      sub_case: "pipe"
      spec_ref: "SPEC.md §8 #6; SRS.md §3 FR-01 (injection chars)"
      layer: unit
      test_function: test_fr01_submit_injection_pipe_rejected
      assertion: 'python -m taskq_plus submit "echo hi | cat" exits 2 (pipe rejected)'
      cross_ref_frs: []
      cross_ref_nfrs: [NFR-02]
    - tc_id: TC-FR01-03c
      fr_id: FR-01
      ac_ref: AC-FR-01.3
      sub_case: "ampersand"
      spec_ref: "SPEC.md §8 #6; SRS.md §3 FR-01 (injection chars)"
      layer: unit
      test_function: test_fr01_submit_injection_ampersand_rejected
      assertion: 'python -m taskq_plus submit "echo hi & echo y" exits 2 (ampersand rejected)'
      cross_ref_frs: []
      cross_ref_nfrs: [NFR-02]
    - tc_id: TC-FR01-03d
      fr_id: FR-01
      ac_ref: AC-FR-01.3
      sub_case: "dollar"
      spec_ref: "SPEC.md §8 #6; SRS.md §3 FR-01 (injection chars)"
      layer: unit
      test_function: test_fr01_submit_injection_dollar_rejected
      assertion: 'python -m taskq_plus submit "echo $HOME" exits 2 (dollar rejected)'
      cross_ref_frs: []
      cross_ref_nfrs: [NFR-02]
    - tc_id: TC-FR01-03e
      fr_id: FR-01
      ac_ref: AC-FR-01.3
      sub_case: "gt"
      spec_ref: "SPEC.md §8 #6; SRS.md §3 FR-01 (injection chars)"
      layer: unit
      test_function: test_fr01_submit_injection_gt_rejected
      assertion: 'python -m taskq_plus submit "echo hi > x" exits 2 (greater-than rejected)'
      cross_ref_frs: []
      cross_ref_nfrs: [NFR-02]
    - tc_id: TC-FR01-03f
      fr_id: FR-01
      ac_ref: AC-FR-01.3
      sub_case: "lt"
      spec_ref: "SPEC.md §8 #6; SRS.md §3 FR-01 (injection chars)"
      layer: unit
      test_function: test_fr01_submit_injection_lt_rejected
      assertion: 'python -m taskq_plus submit "cat < x" exits 2 (less-than rejected)'
      cross_ref_frs: []
      cross_ref_nfrs: [NFR-02]
    - tc_id: TC-FR01-03g
      fr_id: FR-01
      ac_ref: AC-FR-01.3
      sub_case: "backtick"
      spec_ref: "SPEC.md §8 #6; SRS.md §3 FR-01 (injection chars)"
      layer: unit
      test_function: test_fr01_submit_injection_backtick_rejected
      assertion: 'python -m taskq_plus submit "echo `id`" exits 2 (backtick rejected)'
      cross_ref_frs: []
      cross_ref_nfrs: [NFR-02]

    # AC-FR-01.4 — split into two sub-cases: command > 1000 chars + all-whitespace
    - tc_id: TC-FR01-04a
      fr_id: FR-01
      ac_ref: AC-FR-01.4
      sub_case: "command_too_long"
      spec_ref: "SRS.md §3 FR-01 (Length)"
      layer: unit
      test_function: test_fr01_submit_command_too_long_rejected
      assertion: 'submit of a 1001-character command exits 2; tasks.json unchanged'
      cross_ref_frs: []
      cross_ref_nfrs: [NFR-03]
    - tc_id: TC-FR01-04b
      fr_id: FR-01
      ac_ref: AC-FR-01.4
      sub_case: "whitespace_only"
      spec_ref: "SRS.md §3 FR-01 (Non-empty)"
      layer: unit
      test_function: test_fr01_submit_whitespace_only_rejected
      assertion: 'python -m taskq_plus submit "   " exits 2 (all-whitespace rejected)'
      cross_ref_frs: []
      cross_ref_nfrs: []

    - tc_id: TC-FR01-05
      fr_id: FR-01
      ac_ref: AC-FR-01.5
      spec_ref: "SRS.md §3 FR-01 (Name unique)"
      layer: unit
      test_function: test_fr01_submit_duplicate_name_rejected
      assertion: 'resubmit with --name matching an existing pending/running task exits 2'
      cross_ref_frs: []
      cross_ref_nfrs: []

    - tc_id: TC-FR01-06
      fr_id: FR-01
      ac_ref: AC-FR-01.6
      spec_ref: "SPEC.md §7 row '--after points to non-existent id'"
      layer: unit
      test_function: test_fr01_submit_invalid_dependency_rejected
      assertion: '--after referencing a non-existent task id exits 2 with stderr identifying the bad dep'
      cross_ref_frs: []
      cross_ref_nfrs: []

    - tc_id: TC-FR01-07
      fr_id: FR-01
      ac_ref: AC-FR-01.7
      spec_ref: "SPEC.md §3 FR-01 / FR-08 audit binding"
      layer: integration
      test_function: test_fr01_submit_emits_audit_event
      assertion: 'successful submit writes exactly one "submit" JSONL audit event to $TASKQ_AUDIT_LOG with the new id and detail schema'
      cross_ref_frs: [FR-08]
      cross_ref_nfrs: []

    # ===== FR-02: 任務執行器 (5 ACs) =====
    - tc_id: TC-FR02-01
      fr_id: FR-02
      ac_ref: AC-FR-02.1
      spec_ref: "SPEC.md §8 #15"
      layer: unit
      test_function: test_fr02_shell_false_invariant
      assertion: 'grep -rn "shell=True" 03-development/src/ returns 0 hits'
      cross_ref_frs: []
      cross_ref_nfrs: [NFR-02]

    - tc_id: TC-FR02-02
      fr_id: FR-02
      ac_ref: AC-FR-02.2
      spec_ref: "SPEC.md §3 FR-02 (Result fields)"
      layer: unit
      test_function: test_fr02_completion_fields_atomic_write
      assertion: 'every terminal status writes exit_code / stdout_tail / stderr_tail / duration_ms / finished_at in one atomic transition'
      cross_ref_frs: []
      cross_ref_nfrs: [NFR-03]

    - tc_id: TC-FR02-03
      fr_id: FR-02
      ac_ref: AC-FR-02.3
      spec_ref: "SPEC.md §3 FR-02 (--all concurrency); SPEC.md §8 #15"
      layer: integration
      test_function: test_fr02_run_all_kahn_topological_order
      assertion: 'run --all uses ThreadPoolExecutor(max_workers=TASKQ_MAX_WORKERS); concurrent writes serialised by shared threading.Lock; mid-write crash leaves tasks.json as valid JSON'
      cross_ref_frs: [FR-06]
      cross_ref_nfrs: [NFR-03]

    - tc_id: TC-FR02-04
      fr_id: FR-02
      ac_ref: AC-FR-02.4
      spec_ref: "SPEC.md §8 #7"
      layer: unit
      test_function: test_fr02_timeout_yields_exit_4
      assertion: 'TASKQ_TASK_TIMEOUT=1 python -m taskq_plus run <sleep-5-id> reports status=timeout and exits 4'
      cross_ref_frs: []
      cross_ref_nfrs: []

    - tc_id: TC-FR02-05
      fr_id: FR-02
      ac_ref: AC-FR-02.5
      spec_ref: "SPEC.md §3 FR-02 (末 2000 字元)"
      layer: unit
      test_function: test_fr02_stdout_tail_truncated_2000_chars
      assertion: 'stdout_tail / stderr_tail contain at most the last 2000 chars of the captured streams'
      cross_ref_frs: []
      cross_ref_nfrs: []

    # ===== FR-03: 重試與斷路器 (5 ACs; AC-03.4 split into 2 sub-cases) =====
    - tc_id: TC-FR03-01
      fr_id: FR-03
      ac_ref: AC-FR-03.1
      spec_ref: "SPEC.md §3 FR-03 (Retry)"
      layer: unit
      test_function: test_fr03_retry_with_exponential_backoff
      assertion: 'failed/timeout retries up to TASKQ_RETRY_LIMIT; nth retry waits TASKQ_BACKOFF_BASE * 2^n seconds; sleep function is injectable for test isolation'
      cross_ref_frs: []
      cross_ref_nfrs: []

    - tc_id: TC-FR03-02
      fr_id: FR-03
      ac_ref: AC-FR-03.2
      spec_ref: "SPEC.md §3 FR-03 (Breaker threshold); SPEC.md §8 #8 negative path"
      layer: unit
      test_function: test_fr03_breaker_threshold_persists_open
      assertion: 'after TASKQ_BREAKER_THRESHOLD consecutive final failures (post-retry) breaker state == OPEN and is persisted atomically to breaker.json'
      cross_ref_frs: []
      cross_ref_nfrs: [NFR-03]

    - tc_id: TC-FR03-03
      fr_id: FR-03
      ac_ref: AC-FR-03.3
      spec_ref: "SPEC.md §8 #8"
      layer: unit
      test_function: test_fr03_breaker_open_rejects_with_exit_3
      assertion: 'while OPEN, any run immediately rejects with exit 3 + stderr "breaker open"; no subprocess executes'
      cross_ref_frs: []
      cross_ref_nfrs: []

    # AC-FR-03.4 — split into HALF_OPEN success + HALF_OPEN failure sub-cases
    - tc_id: TC-FR03-04a
      fr_id: FR-03
      ac_ref: AC-FR-03.4
      sub_case: "success_closes"
      spec_ref: "SPEC.md §3 FR-03 (HALF_OPEN success branch)"
      layer: unit
      test_function: test_fr03_breaker_half_open_success_closes
      assertion: 'OPEN → HALF_OPEN after TASKQ_BREAKER_COOLDOWN seconds; one task succeeds → state == CLOSED and failure counter resets to 0'
      cross_ref_frs: []
      cross_ref_nfrs: []
    - tc_id: TC-FR03-04b
      fr_id: FR-03
      ac_ref: AC-FR-03.4
      sub_case: "failure_reopens"
      spec_ref: "SPEC.md §3 FR-03 (HALF_OPEN failure branch)"
      layer: unit
      test_function: test_fr03_breaker_half_open_failure_reopens
      assertion: 'OPEN → HALF_OPEN after TASKQ_BREAKER_COOLDOWN seconds; one task fails → state returns to OPEN'
      cross_ref_frs: []
      cross_ref_nfrs: []

    - tc_id: TC-FR03-05
      fr_id: FR-03
      ac_ref: AC-FR-03.5
      spec_ref: "SPEC.md §8 #8 positive path"
      layer: integration
      test_function: test_fr03_breaker_recovers_after_cooldown
      assertion: 'once counter reaches threshold, cooldown passes, and a task succeeds, a subsequent run is admitted normally (no exit 3, normal completion)'
      cross_ref_frs: []
      cross_ref_nfrs: []

    # ===== FR-04: 結果 TTL 快取 (4 ACs) =====
    - tc_id: TC-FR04-01
      fr_id: FR-04
      ac_ref: AC-FR-04.1
      spec_ref: "SPEC.md §3 FR-04 (快取簽名 = sha256(command))"
      layer: unit
      test_function: test_fr04_cache_signature_is_sha256_of_command
      assertion: 'cache signature == sha256(command) (binary content); the same string always maps to the same key'
      cross_ref_frs: []
      cross_ref_nfrs: []

    - tc_id: TC-FR04-02
      fr_id: FR-04
      ac_ref: AC-FR-04.2
      spec_ref: "SPEC.md §8 #9"
      layer: unit
      test_function: test_fr04_cache_hit_replays_without_subprocess
      assertion: 'within TASKQ_CACHE_TTL of a done run, --cached replays exit_code and stdout_tail, marks the task done with cached: true, and does not spawn a subprocess (child-process counter unchanged)'
      cross_ref_frs: []
      cross_ref_nfrs: []

    - tc_id: TC-FR04-03
      fr_id: FR-04
      ac_ref: AC-FR-04.3
      spec_ref: "SPEC.md §3 FR-04 (cache miss / TTL expiry)"
      layer: unit
      test_function: test_fr04_cache_miss_atomic_write
      assertion: 'cache miss or TTL expiry triggers normal execution; on done, the result is written atomically (tmp + os.replace) to cache.json under sha256(command) with cached_at'
      cross_ref_frs: []
      cross_ref_nfrs: [NFR-03]

    - tc_id: TC-FR04-04
      fr_id: FR-04
      ac_ref: AC-FR-04.4
      spec_ref: "SPEC.md §3 FR-04 (thread-safety)"
      layer: integration
      test_function: test_fr04_cache_thread_safe_with_run_all
      assertion: 'concurrent cache reads/writes from run --all never produce a corrupt or missing entry (lock-protected; final cache.json is valid JSON)'
      cross_ref_frs: [FR-02]
      cross_ref_nfrs: [NFR-03]

    # ===== FR-05: CLI 整合 (3 ACs; AC-05.1 expanded per subcommand; AC-05.3 expanded per exit-code) =====
    - tc_id: TC-FR05-01a
      fr_id: FR-05
      ac_ref: AC-FR-05.1
      sub_case: "submit_reachable"
      spec_ref: "SPEC.md §3 FR-05 subcommands table"
      layer: unit
      test_function: test_fr05_cli_reachable_submit
      assertion: 'python -m taskq_plus submit is registered and reachable (click group)'
      cross_ref_frs: [FR-01]
      cross_ref_nfrs: []
    - tc_id: TC-FR05-01b
      fr_id: FR-05
      ac_ref: AC-FR-05.1
      sub_case: "run_reachable"
      spec_ref: "SPEC.md §3 FR-05 subcommands table"
      layer: unit
      test_function: test_fr05_cli_reachable_run
      assertion: 'python -m taskq_plus run (both <id> and --all) is registered and reachable'
      cross_ref_frs: [FR-02]
      cross_ref_nfrs: []
    - tc_id: TC-FR05-01c
      fr_id: FR-05
      ac_ref: AC-FR-05.1
      sub_case: "status_reachable"
      spec_ref: "SPEC.md §3 FR-05 subcommands table"
      layer: unit
      test_function: test_fr05_cli_reachable_status
      assertion: 'python -m taskq_plus status <id> is registered; prints the full task fields'
      cross_ref_frs: []
      cross_ref_nfrs: []
    - tc_id: TC-FR05-01d
      fr_id: FR-05
      ac_ref: AC-FR-05.1
      sub_case: "list_reachable"
      spec_ref: "SPEC.md §3 FR-05 subcommands table"
      layer: unit
