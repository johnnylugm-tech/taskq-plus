# TEST_INVENTORY.yaml — P1 Per-AC Test Enumeration (Sub-Task 4/4 Naming Authority)
#
# Naming convention source: 01-requirements/TRACEABILITY_MATRIX.md §1.3
#   test_<scope><NN>_<suffix>   where <suffix> matches the originating AC letter
#   AC-FR-NN.x  -> test_frNN_x
#   AC-NFR-NN.x -> test_nfrNN_x
#
# Cross-cutting / multi-AC overlap (e.g. NFR-02.a grep covers FR-02.e / FR-07.e)
# is signalled via per-test metadata (cross_ref_frs / cross_ref_nfrs), NOT by
# deleting the underlying FR-derived test entries.
#
# Loader contract:
#   - first line MUST start with '# TEST_INVENTORY.yaml — '
#   - top-level key 'test_inventory:' MUST exist
#   - 'tests:' block enumerates one entry per tc_id (no range collapsing)
#   - 'by_fr.*.tc_count', 'by_layer.*.count', 'total_test_cases'
#     MUST equal the count of enumerated 'tests:' entries (no arithmetic drift)

test_inventory:
  format_version: "1.2"
  source_matrix: "01-requirements/TRACEABILITY_MATRIX.md"
  source_srs: "01-requirements/SRS.md"
  total_test_cases: 63
  fr_count: 34
  nfr_count: 29

# Top-level keys required by harness validate-handoff --from-phase 1.
# These mirror the per-FR and cross_cutting entries inside test_inventory:
# below and exist so the handoff validator can locate per-FR test names
